<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-labelledby="title desc">
  <title id="title">Research focus banner</title>
  <desc id="desc">A clean anime-inspired research banner with subtle neon glow and focus labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020203"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="50%" stop-color="#ff7ad9"/>
      <stop offset="100%" stop-color="#ffe66d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="rgb(255,255,255)" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="360" rx="28" fill="url(#grid)" opacity="0.10"/>

  <circle cx="210" cy="82" r="78" fill="#7df9ff" opacity="0.04" filter="url(#glow)">
    <animate attributeName="r" values="70;88;70" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1388" cy="82" r="94" fill="#ff7ad9" opacity="0.04" filter="url(#glow)">
    <animate attributeName="r" values="88;108;88" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="140" y="56" width="1320" height="248" rx="26" fill="rgb(0,0,0)" fill-opacity="0.94" stroke="rgb(255,255,255)" stroke-opacity="0.08"/>
  <rect x="164" y="80" width="1272" height="200" rx="20" fill="rgb(0,0,0)" fill-opacity="0.86" stroke="rgb(125,249,255)" stroke-opacity="0.06"/>

  <g filter="url(#glow)" font-family="monospace" text-anchor="middle">
    <text x="800" y="176" font-size="56" font-weight="700" letter-spacing="4" fill="#f6f8ff">研究内容</text>
  </g>

  <g font-family="monospace" font-size="14" text-anchor="middle">
    <rect x="402" y="244" width="130" height="34" rx="17" fill="rgb(125,249,255)" fill-opacity="0.06" stroke="rgb(125,249,255)" stroke-opacity="0.18"/>
    <text x="467" y="267" fill="#bffbff">Research</text>

    <rect x="548" y="244" width="164" height="34" rx="17" fill="rgb(255,122,217)" fill-opacity="0.06" stroke="rgb(255,122,217)" stroke-opacity="0.18"/>
    <text x="630" y="267" fill="#ffd0f0">Computer Vision</text>

    <rect x="728" y="244" width="130" height="34" rx="17" fill="rgb(255,230,109)" fill-opacity="0.06" stroke="rgb(255,230,109)" stroke-opacity="0.18"/>
    <text x="793" y="267" fill="#fff1ab">Game Dev</text>

    <rect x="874" y="244" width="166" height="34" rx="17" fill="rgb(140,255,106)" fill-opacity="0.06" stroke="rgb(140,255,106)" stroke-opacity="0.18"/>
    <text x="957" y="267" fill="#d8ffd0">Anime / Games</text>
  </g>

  <path d="M430 304H1170" stroke="rgb(255,255,255)" stroke-opacity="0.06" stroke-width="2"/>
  <path d="M650 304H950" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0 300;180 300;0 300" dur="4.2s" repeatCount="indefinite"/>
  </path>
</svg>