<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Research content banner</title>
  <desc id="desc">A clear anime-inspired research content banner with neon accents, stars, and large focus labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b1f"/>
      <stop offset="45%" stop-color="#15102a"/>
      <stop offset="100%" stop-color="#071522"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="48%" stop-color="#ff7ad9"/>
      <stop offset="100%" stop-color="#ffe66d"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7cf"/>
      <stop offset="100%" stop-color="#ff7ad9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="30" fill="url(#grid)" opacity="0.65"/>

  <g opacity="0.75">
    <circle cx="190" cy="78" r="3" fill="#7df9ff"/>
    <circle cx="330" cy="132" r="2" fill="#ffe66d"/>
    <circle cx="1270" cy="88" r="3" fill="#ff7ad9"/>
    <circle cx="1406" cy="230" r="2" fill="#7df9ff"/>
    <path d="M251 245l9 18 20 3-15 14 4 20-18-10-18 10 4-20-15-14 20-3z" fill="#ffe66d" opacity="0.55"/>
    <path d="M1344 145l7 14 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" fill="#7df9ff" opacity="0.55"/>
  </g>

  <circle cx="1286" cy="120" r="82" fill="url(#moon)" opacity="0.92" filter="url(#glow)"/>
  <circle cx="1248" cy="98" r="82" fill="#15102a" opacity="0.96"/>

  <g transform="translate(116,64)">
    <rect x="0" y="0" width="1060" height="292" rx="26" fill="#0b1020" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="24" y="24" width="1012" height="244" rx="20" fill="#050816" fill-opacity="0.76" stroke="url(#accent)" stroke-opacity="0.7"/>

    <text x="64" y="86" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#7df9ff" letter-spacing="4">RESEARCH CONTENT</text>
    <text x="64" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="900" fill="#f8fbff">研究内容</text>
    <text x="68" y="216" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="650" fill="#dce7ff">Computer Vision / Game Dev / Anime &amp; Games</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">
      <rect x="64" y="236" width="132" height="44" rx="22" fill="#7df9ff" fill-opacity="0.12" stroke="#7df9ff" stroke-opacity="0.45"/>
      <text x="130" y="265" fill="#bffbff" text-anchor="middle">Research</text>

      <rect x="214" y="236" width="202" height="44" rx="22" fill="#ff7ad9" fill-opacity="0.12" stroke="#ff7ad9" stroke-opacity="0.45"/>
      <text x="315" y="265" fill="#ffd4f1" text-anchor="middle">Computer Vision</text>

      <rect x="434" y="236" width="136" height="44" rx="22" fill="#ffe66d" fill-opacity="0.13" stroke="#ffe66d" stroke-opacity="0.5"/>
      <text x="502" y="265" fill="#fff2a8" text-anchor="middle">Game Dev</text>

      <rect x="588" y="236" width="184" height="44" rx="22" fill="#9dff8a" fill-opacity="0.10" stroke="#9dff8a" stroke-opacity="0.42"/>
      <text x="680" y="265" fill="#d8ffd0" text-anchor="middle">Anime / Games</text>
    </g>
  </g>

  <g transform="translate(1220,232)" filter="url(#glow)">
    <path d="M64 0h132l38 38v116H64z" fill="#0b1020" stroke="#7df9ff" stroke-width="4"/>
    <path d="M196 0v38h38" fill="none" stroke="#7df9ff" stroke-width="4"/>
    <path d="M94 62h124M94 90h92M94 118h112" stroke="#ff7ad9" stroke-width="6" stroke-linecap="round"/>
    <text x="152" y="190" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#ffe66d">START</text>
  </g>

  <path d="M140 372H1460" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.92"/>
</svg>
