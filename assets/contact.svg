<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" role="img" aria-labelledby="title desc">
  <title id="title">Contact card</title>
  <desc id="desc">A clean anime-style contact banner with a neon mail accent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070816"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="50%" stop-color="#ff7ad9"/>
      <stop offset="100%" stop-color="#ffe66d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="180" rx="28" fill="url(#bg)"/>
  <rect x="22" y="22" width="1556" height="136" rx="22" fill="rgb(255,255,255)" fill-opacity="0.03" stroke="rgb(255,255,255)" stroke-opacity="0.10"/>

  <circle cx="126" cy="90" r="48" fill="rgb(125,249,255)" fill-opacity="0.10" filter="url(#glow)">
    <animate attributeName="r" values="42;54;42" dur="4s" repeatCount="indefinite"/>
  </circle>
  <path d="M106 77h40v26h-40z" fill="none" stroke="#7df9ff" stroke-width="3"/>
  <path d="M106 77l20 16 20-16" fill="none" stroke="#7df9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="monospace" filter="url(#glow)">
    <text x="240" y="82" font-size="26" letter-spacing="6" fill="#7df9ff">CONTACT</text>
    <text x="240" y="118" font-size="18" fill="#d9e1ff">2188726251@qq.com</text>
  </g>

  <rect x="1100" y="62" width="390" height="56" rx="28" fill="rgb(255,255,255)" fill-opacity="0.05" stroke="url(#accent)" stroke-width="2"/>
  <text x="1295" y="98" text-anchor="middle" font-family="monospace" font-size="18" fill="#fff1ab" letter-spacing="4">OPEN FOR CHAT</text>

  <path d="M240 132H1440" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</svg>