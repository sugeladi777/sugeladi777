<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" role="img" aria-labelledby="title desc">
  <title id="title">Contact card</title>
  <desc id="desc">Anime-inspired contact banner with email address and neon accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="55%" stop-color="#160c25"/>
      <stop offset="100%" stop-color="#06131b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="48%" stop-color="#ff7ad9"/>
      <stop offset="100%" stop-color="#ffe66d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="200" rx="28" fill="url(#bg)"/>
  <rect x="28" y="28" width="1544" height="144" rx="24" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.12"/>

  <g transform="translate(92,54)" filter="url(#glow)">
    <circle cx="46" cy="46" r="44" fill="#7df9ff" fill-opacity="0.14"/>
    <path d="M18 30h56v38H18z" fill="none" stroke="#7df9ff" stroke-width="4" stroke-linejoin="round"/>
    <path d="M18 30l28 23 28-23" fill="none" stroke="#7df9ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="210" y="86" font-size="25" font-weight="800" fill="#7df9ff" letter-spacing="4">CONTACT CHANNEL</text>
    <text x="210" y="126" font-size="26" font-weight="700" fill="#f8fbff">2188726251@qq.com</text>
  </g>

  <g transform="translate(1050,58)">
    <rect x="0" y="0" width="400" height="84" rx="20" fill="#050816" fill-opacity="0.72" stroke="url(#accent)" stroke-width="3"/>
    <text x="200" y="36" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#ff7ad9" letter-spacing="3">OPEN FOR CHAT</text>
    <text x="200" y="62" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#fff2a8">一起做点有趣的东西</text>
  </g>

  <path d="M210 150H1450" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
</svg>
