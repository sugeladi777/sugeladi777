<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Animated profile status panel</title>
  <desc id="desc">A sci-fi style status panel with animated gauges, tags, and scanning highlights.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1020"/>
      <stop offset="100%" stop-color="#05060c"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#6f8cff"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7ad9"/>
      <stop offset="100%" stop-color="#ffe66d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#panelBg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#grid)" opacity="0.7"/>

  <path d="M-60 330C220 230 390 420 640 330C850 255 1110 120 1660 236" fill="none" stroke="rgba(125,249,255,0.14)" stroke-width="22" filter="url(#glow)"/>
  <path d="M-40 350C240 268 430 444 670 360C910 278 1130 170 1640 284" fill="none" stroke="rgba(255,122,217,0.11)" stroke-width="14" filter="url(#glow)"/>

  <g opacity="0.55" filter="url(#glow)">
    <circle cx="120" cy="80" r="90" fill="#7df9ff" opacity="0.10">
      <animate attributeName="r" values="80;110;80" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1480" cy="320" r="110" fill="#ff7ad9" opacity="0.08">
      <animate attributeName="cy" values="320;300;320" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(70 56)">
    <rect width="1460" height="308" rx="24" fill="rgba(9,11,21,0.78)" stroke="rgba(255,255,255,0.14)"/>
    <rect x="20" y="20" width="1420" height="268" rx="18" fill="rgba(255,255,255,0.02)" stroke="rgba(124,249,255,0.12)"/>
  </g>

  <g opacity="0.65">
    <rect x="108" y="96" width="300" height="3" rx="1.5" fill="url(#sweep)">
      <animate attributeName="x" values="108;1140;108" dur="6.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="monospace" fill="#dce7ff">
    <text x="120" y="132" font-size="26" fill="#7df9ff" letter-spacing="6">PROFILE STATUS</text>
    <text x="120" y="176" font-size="20" fill="#dfe6ff">GAME DEV / CV / ANIME / GAMES</text>
    <text x="120" y="220" font-size="17" opacity="0.9">FOCUS</text>
    <text x="120" y="252" font-size="22" fill="#ff7ad9">BUILDING WORLDS</text>
  </g>

  <g transform="translate(120 276)" font-family="monospace" fill="#fff">
    <rect width="138" height="28" rx="14" fill="rgba(125,249,255,0.10)" stroke="rgba(125,249,255,0.28)"/>
    <text x="69" y="19" text-anchor="middle" font-size="14" fill="#bffbff">FOCUS MODE</text>
    <rect x="152" width="154" height="28" rx="14" fill="rgba(255,122,217,0.10)" stroke="rgba(255,122,217,0.28)"/>
    <text x="229" y="19" text-anchor="middle" font-size="14" fill="#ffd0f0">NEON UI</text>
    <rect x="320" width="164" height="28" rx="14" fill="rgba(255,230,109,0.10)" stroke="rgba(255,230,109,0.28)"/>
    <text x="402" y="19" text-anchor="middle" font-size="14" fill="#fff1ab">READY TO PLAY</text>
  </g>

  <g transform="translate(860 122)">
    <rect x="0" y="0" width="540" height="26" rx="13" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="0" width="360" height="26" rx="13" fill="url(#accentA)">
      <animate attributeName="width" values="260;460;320;500;360" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="560" y="19" font-family="monospace" font-size="16" fill="#dce7ff">SYSTEM</text>
  </g>

  <g transform="translate(860 178)">
    <rect x="0" y="0" width="540" height="26" rx="13" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="0" width="300" height="26" rx="13" fill="url(#accentB)">
      <animate attributeName="width" values="240;410;280;480;300" dur="5.4s" repeatCount="indefinite"/>
    </rect>
    <text x="560" y="19" font-family="monospace" font-size="16" fill="#dce7ff">AIM</text>
  </g>

  <g transform="translate(860 234)">
    <rect x="0" y="0" width="540" height="26" rx="13" fill="rgba(255,255,255,0.08)"/>
    <rect x="0" y="0" width="420" height="26" rx="13" fill="url(#accentA)">
      <animate attributeName="width" values="340;500;390;540;420" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="560" y="19" font-family="monospace" font-size="16" fill="#dce7ff">ENERGY</text>
  </g>

  <g font-family="monospace" font-size="16" fill="#fff" opacity="0.9">
    <rect x="120" y="300" width="130" height="34" rx="17" fill="rgba(125,249,255,0.14)" stroke="rgba(125,249,255,0.36)"/>
    <text x="185" y="323" text-anchor="middle">READY</text>
    <rect x="270" y="300" width="150" height="34" rx="17" fill="rgba(255,122,217,0.14)" stroke="rgba(255,122,217,0.36)"/>
    <text x="345" y="323" text-anchor="middle">ONLINE</text>
    <rect x="440" y="300" width="168" height="34" rx="17" fill="rgba(255,230,109,0.14)" stroke="rgba(255,230,109,0.36)"/>
    <text x="524" y="323" text-anchor="middle">ANIMATED</text>
  </g>

  <g transform="translate(1138 296)" opacity="0.85">
    <path d="M0 18c0-10 8-18 18-18h104c10 0 18 8 18 18s-8 18-18 18H18C8 36 0 28 0 18z" fill="rgba(125,249,255,0.08)" stroke="rgba(125,249,255,0.24)"/>
    <text x="70" y="23" text-anchor="middle" font-family="monospace" font-size="14" fill="#dffcff">LIVE DASHBOARD</text>
  </g>

  <g opacity="0.8" filter="url(#glow)">
    <path d="M1260 92a50 50 0 1 1-100 0a50 50 0 1 1 100 0" fill="none" stroke="url(#accentA)" stroke-width="3" stroke-dasharray="12 12">
      <animateTransform attributeName="transform" type="rotate" from="0 1210 92" to="360 1210 92" dur="14s" repeatCount="indefinite"/>
    </path>
    <circle cx="1210" cy="92" r="10" fill="#7df9ff"/>
  </g>

  <g opacity="0.75">
    <path d="M1320 94h104" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <path d="M1320 118h148" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
    <path d="M1320 142h80" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  </g>

  <rect x="74" y="58" width="1452" height="304" rx="24" fill="none" stroke="rgba(255,255,255,0.08)"/>
</svg>